name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PowerShell ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          $paths = Get-ChildItem ./Tests -Filter '*.Tests.ps1' |
            Where-Object Name -ne 'PowerTree.Integration.Tests.ps1' |
            Select-Object -ExpandProperty FullName
          $result = Invoke-Pester -Path $paths -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed"
          }

      - name: Run integration tests
        shell: pwsh
        run: ./Tests/PowerTree.Integration.Tests.ps1
